services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - evhub-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    working_dir: /var/www
    command: >
      sh -c "if [ ! -f .env ]; then cp .env.example .env; fi
      && composer install --no-interaction
      && if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
      && php artisan migrate --force
      && exec php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: evcharge
      DB_USERNAME: evcharge
      DB_PASSWORD: evcharge_local
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evhub-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: evcharge
      MYSQL_USER: evcharge
      MYSQL_PASSWORD: evcharge_local
      MYSQL_ROOT_PASSWORD: evcharge_root_local
    ports:
      - "3307:3306"
    volumes:
      - evcharge_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - evhub-network
    restart: unless-stopped

volumes:
  evcharge_mysql_data:
  backend_vendor:
  frontend_node_modules:

networks:
  evhub-network:
    driver: bridge
